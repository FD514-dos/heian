<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bình An Kinh</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:serif;
background:white;
}

#login{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
color:white;
z-index:10;
}

#title{
font-size:40px;
margin-bottom:20px;
}

iinput{
padding:10px;
width:300px;
font-size:20px;
background:black;
border:2px solid white;
color:white;
outline:none;
}

button{
margin-top:20px;
padding:12px 40px;

background:black;
color:white;

border:2px solid white;

font-size:24px;

cursor:pointer;
}
  
#error{
margin-top:10px;
color:red;
}

#message{
position:absolute;

width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;

background:black;

text-align:center;

font-size:60px;

color:white;

z-index:999;
}

canvas{
display:none;
}

</style>
</head>

<body>

<div id="login">

<div id="title">
Thỉnh quân báo danh tính
</div>

<input id="name">

<button id="enter">
Tiến nhập
</button>

<div id="error"></div>

</div>

<div id="message">
Mừng khách nhân tới Bình An Kinh
</div>

<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let players = {};
let myId = null;

const mapSize = 4000;

const camera = {
x:0,
y:0
};

const spawnPoint = {
x:2000,
y:3850
};

const npc = {

x:2000,
y:3700,

targetX:2000,
targetY:3700,

waitTimer:0,
teleportTimer:0,
state:"move"

};

document.getElementById("enter").onclick = ()=>{

const name =
document.getElementById("name").value.trim();

socket.emit("login", name);

};

socket.on("loginFailed",(msg)=>{

document.getElementById("error").innerText = msg;

});

socket.on("loginSuccess",(player)=>{

myId = player.id;

document.getElementById("login").style.background =
"black";

document.getElementById("login").innerHTML = "";

setTimeout(()=>{

document.getElementById("login").style.display =
"none";

document.getElementById("message").style.display =
"flex";

setTimeout(()=>{

document.getElementById("message").style.display =
"none";

canvas.style.display = "block";

loop();

},2500);

},1000);

});

socket.on("players",(p)=>{

players = p;

});

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowUp")
socket.emit("move","up");

if(e.key==="ArrowDown")
socket.emit("move","down");

if(e.key==="ArrowLeft")
socket.emit("move","left");

if(e.key==="ArrowRight")
socket.emit("move","right");

});

function drawTorii(x,y){

ctx.fillStyle = "black";
ctx.strokeStyle = "white";
ctx.lineWidth = 4;

function block(px,py,w,h){

ctx.fillRect(px,py,w,h);
ctx.strokeRect(px,py,w,h);

}

block(x,y,20,200);

block(x+180,y,20,200);

block(x-40,y,280,20);

block(x-20,y+40,240,15);

}

function drawMap(){

ctx.fillStyle = "black";
ctx.fillRect(0,0,canvas.width,canvas.height);

/* map */

ctx.fillStyle = "white";

ctx.fillRect(
0-camera.x,
0-camera.y,
mapSize,
mapSize
);

/* con đường */

const roadX = 1970;

ctx.fillStyle = "black";

ctx.fillRect(
roadX-camera.x,
0-camera.y,
60,
4000
);

ctx.strokeStyle = "white";

ctx.lineWidth = 4;

ctx.strokeRect(
roadX-camera.x,
0-camera.y,
60,
4000
);

/* cổng torii sát mép dưới */

drawTorii(
1900-camera.x,
3790-camera.y
);

}

function drawFrontLayer(){

ctx.fillStyle = "black";
ctx.strokeStyle = "white";
ctx.lineWidth = 4;

function block(px,py,w,h){

ctx.fillRect(px,py,w,h);
ctx.strokeRect(px,py,w,h);

}

/* torii front */

block(
1900-camera.x,
3790-camera.y,
20,
200
);

block(
2080-camera.x,
3790-camera.y,
20,
200
);

block(
1860-camera.x,
3790-camera.y,
280,
20
);

block(
1880-camera.x,
3830-camera.y,
240,
15
);

}

function teleportNPC(){

npc.x = Math.random()*3900;
npc.y = Math.random()*3900;

npc.targetX = npc.x;
npc.targetY = npc.y;

npc.state = "move";
npc.waitTimer = 0;

}

function loop(){

requestAnimationFrame(loop);

const me = players[myId];

if(me){

camera.x = me.x-innerWidth/2;
camera.y = me.y-innerHeight/2;

/* vùng đen vô tận */

if(
me.x < 0 ||
me.y < 0 ||
me.x > mapSize ||
me.y > mapSize
){

if(!me.voidTimer){

me.voidTimer = Date.now();

}

if(Date.now() - me.voidTimer > 60000){

me.x = spawnPoint.x;
me.y = spawnPoint.y;

me.voidTimer = null;

}

}else{

me.voidTimer = null;

}

}

/* NPC */

Object.values(players).forEach(p=>{

const dx = p.x-npc.x;
const dy = p.y-npc.y;

const dist = Math.sqrt(dx*dx+dy*dy);

/* người chơi tiến quá gần -> biến mất */

if(dist < 20){

teleportNPC();

}

/* tiếp cận */

if(npc.state === "move"){

if(dist < 500){

const angle = Math.atan2(dy,dx);

/* giữ khoảng cách 20 pixel */

if(dist > 20){

npc.x += Math.cos(angle)*2;
npc.y += Math.sin(angle)*2;

}else{

npc.state = "wait";
npc.waitTimer = Date.now();

}

}

}

/* đứng yên 10 giây */

if(npc.state === "wait"){

if(Date.now() - npc.waitTimer > 10000){

teleportNPC();

}

}

});

drawMap();

drawPlayers();

drawFrontLayer();

}

</script>

</body>
</html>
