<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bình An Kinh</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:serif;
background:white;
}

#login{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
color:white;
z-index:10;
}

#title{
font-size:40px;
margin-bottom:20px;
}

input{
padding:10px;
width:300px;
font-size:20px;
background:black;
border:2px solid white;
color:white;
outline:none;
}

button{
margin-top:20px;
padding:12px 40px;

background:black;
color:white;

border:2px solid white;

font-size:24px;

cursor:pointer;
}
  
#error{
margin-top:10px;
color:red;
}

#message{
position:absolute;

width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;

background:black;

text-align:center;

font-size:60px;

color:white;

z-index:999;
}

canvas{
display:none;
}

</style>
</head>

<body>

<div id="login">

<div id="title">
Thỉnh quân báo danh tính
</div>

<input id="name">

<button id="enter">
Tiến nhập
</button>

<div id="error"></div>

</div>

<div id="message">
Mừng khách nhân tới Bình An Kinh
</div>

<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let players = {};
let myId = null;
let voidTimer = 0;
const mapSize = 1000;

const camera = {
x:0,
y:0
};
const npc = {

x:2000,
y:1800,

targetX:2000,
targetY:1800,

teleportTimer:0

};
document.getElementById("enter").onclick = ()=>{

const name =
document.getElementById("name").value.trim();

socket.emit("login", name);

};

socket.on("loginFailed",(msg)=>{

document.getElementById("error").innerText = msg;

});

socket.on("loginSuccess",(player)=>{

myId = player.id;

document.getElementById("login").style.background =
"black";

document.getElementById("login").innerHTML = "";

setTimeout(()=>{

document.getElementById("login").style.display =
"none";

document.getElementById("message").style.display =
"flex";

setTimeout(()=>{

document.getElementById("message").style.display =
"none";

canvas.style.display = "block";

loop();

},2500);

},1000);

});

socket.on("players",(p)=>{

players = p;

});

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowUp")
socket.emit("move","up");

if(e.key==="ArrowDown")
socket.emit("move","down");

if(e.key==="ArrowLeft")
socket.emit("move","left");

if(e.key==="ArrowRight")
socket.emit("move","right");

});

function drawTorii(x,y){

ctx.fillStyle = "black";

block(x,y,20,200);

block(x+180,y,20,200);

block(x-40,y,280,20);

block(x-20,y+40,240,15);

}

function drawMap(){

ctx.fillStyle = "black";

ctx.fillRect(0,0,canvas.width,canvas.height);

const mapScreenX = -camera.x;
const mapScreenY = -camera.y;

ctx.fillStyle = "white";

ctx.fillRect(
mapScreenX,
mapScreenY,
mapSize,
mapSize
);

for(let x=0;x<mapSize;x+=20){

for(let y=0;y<mapSize;y+=20){

const gx = x+mapScreenX;
const gy = y+mapScreenY;

ctx.fillStyle = "black";

const r = (x*y)%3;

if(r===0){

ctx.fillRect(gx+8,gy+4,2,8);

ctx.fillRect(gx+4,gy+10,2,6);

}

if(r===1){

ctx.fillRect(gx+12,gy+5,2,8);

ctx.fillRect(gx+8,gy+12,2,5);

}

if(r===2){

ctx.fillRect(gx+6,gy+6,2,7);

ctx.fillRect(gx+10,gy+8,2,7);

}

}

}

ctx.fillStyle = "black";

ctx.fillRect(
470-camera.x,
0-camera.y,
60,
793
);

ctx.strokeStyle = "white";

ctx.lineWidth = 4;

ctx.strokeRect(
470-camera.x,
0-camera.y,
60,
793
);

drawTorii(
440-camera.x,
793-camera.y
);

}

function drawPlayers(){

Object.values(players).forEach(p=>{

const x = p.x-camera.x;
const y = p.y-camera.y;

ctx.fillStyle = "white";

ctx.fillRect(x,y,40,40);

ctx.strokeStyle = "black";

ctx.strokeRect(x,y,40,40);

ctx.font = "18px serif";

ctx.lineWidth = 4;

ctx.strokeStyle = "black";

ctx.strokeText(p.name,x-20,y-10);

ctx.fillStyle = "white";

ctx.fillText(p.name,x-20,y-10);

});
const nx = npc.x-camera.x;
const ny = npc.y-camera.y;

ctx.fillStyle = "white";

ctx.fillRect(nx,ny,40,40);

ctx.strokeStyle = "black";

ctx.strokeRect(nx,ny,40,40);

ctx.font = "18px serif";

ctx.lineWidth = 4;

ctx.strokeStyle = "black";

ctx.strokeText("Âm dương sư",nx-30,ny-10);

ctx.fillStyle = "#5a0000";

ctx.fillText("Âm dương sư",nx-30,ny-10);
}

function drawFrontLayer(){

ctx.fillStyle = "black";
ctx.strokeStyle = "white";
ctx.lineWidth = 4;

function block(px,py,w,h){

ctx.fillRect(px,py,w,h);
ctx.strokeRect(px,py,w,h);

}

block(
440-camera.x,
793-camera.y,
20,
200
);

block(
620-camera.x,
793-camera.y,
20,
200
);

block(
400-camera.x,
793-camera.y,
280,
20
);

block(
420-camera.x,
833-camera.y,
240,
15
);

}
function loop(){

requestAnimationFrame(loop);

const me = players[myId];
if(me){

const inside =
me.x >= 0 &&
me.y >= 0 &&
me.x <= mapSize &&
me.y <= mapSize;

if(!inside){

voidTimer++;

}else{

voidTimer = 0;

}

if(voidTimer > 3600){

me.x = 500;
me.y = 900;

voidTimer = 0;

}

}
if(me){

camera.x = me.x-innerWidth/2;

camera.y = me.y-innerHeight/2;

}
npc.teleportTimer++;

if(npc.teleportTimer > 240){

npc.teleportTimer = 0;

npc.x = Math.random()*mapSize;
npc.y = Math.random()*mapSize;

}

let nearest = null;
let nearestDist = 999999;

Object.values(players).forEach(p=>{

const dx = p.x-npc.x;
const dy = p.y-npc.y;

const dist = Math.sqrt(dx*dx+dy*dy);

if(dist < nearestDist){

nearestDist = dist;
nearest = p;

}

});

if(nearest){

const dx = nearest.x-npc.x;
const dy = nearest.y-npc.y;

const dist = Math.sqrt(dx*dx+dy*dy);

if(dist < 500){

const angle = Math.atan2(dy,dx);

if(dist > 70){

npc.x += Math.cos(angle)*4;
npc.y += Math.sin(angle)*4;

}
else if(dist > 45){

npc.x += Math.cos(angle)*1;
npc.y += Math.sin(angle)*1;

}
else{

npc.waitTimer ??= 0;

npc.waitTimer++;

if(dist < 30){

npc.x = Math.random()*mapSize;
npc.y = Math.random()*mapSize;

npc.waitTimer = 0;

}
else{

if(npc.waitTimer > 600){

npc.x = Math.random()*mapSize;
npc.y = Math.random()*mapSize;

npc.waitTimer = 0;

}

}

}

}
else{

if(Math.random()<0.02){

npc.targetX = Math.random()*mapSize;
npc.targetY = Math.random()*mapSize;

}

const dx2 = npc.targetX-npc.x;
const dy2 = npc.targetY-npc.y;

const angle2 = Math.atan2(dy2,dx2);

npc.x += Math.cos(angle2)*5;
npc.y += Math.sin(angle2)*5;

}

}

drawMap();

drawPlayers();

drawFrontLayer();

}

</script>

</body>
</html>
