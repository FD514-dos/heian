<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bình An Kinh</title>

<style>
  
#dialogue{

position:absolute;

bottom:40px;
left:50%;

transform:translateX(-50%);

padding:18px 28px;

background:white;

border:4px solid black;

font-size:28px;

color:black;

display:none;

z-index:500;

max-width:900px;

text-align:center;

box-shadow:
0 0 0 3px white;

}
body{
margin:0;
overflow:hidden;
font-family:serif;
background:white;
}

#login{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
color:white;
z-index:10;
}

#title{
font-size:40px;
margin-bottom:20px;
}

iinput{
padding:10px;
width:300px;
font-size:20px;
background:black;
border:2px solid white;
color:white;
outline:none;
}

button{
margin-top:20px;
padding:12px 40px;

background:black;
color:white;

border:2px solid white;

font-size:24px;

cursor:pointer;
}
  
#error{
margin-top:10px;
color:red;
}

#message{
position:absolute;

width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;

background:black;

text-align:center;

font-size:60px;

color:white;

z-index:999;
}

canvas{
display:none;
}

</style>
</head>

<body>

<div id="login">

<div id="title">
Thỉnh quân báo danh tính
</div>

<input id="name">

<button id="enter">
Tiến nhập
</button>

<div id="error"></div>

</div>

<div id="message">
Mừng khách nhân tới Bình An Kinh
</div>
<div id="dialogue"></div>
<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let players = {};
let myId = null;

const mapSize = 4000;

const camera = {
x:0,
y:0
};

const spawnPoint = {
x:2000,
y:3850
};

const npc = {

x:Math.random()*3900,
y:Math.random()*3900,

targetX:Math.random()*3900,
targetY:Math.random()*3900,

speed:1.2,

state:"wander",

waitTimer:0,
teleportTimer:Date.now(),
freezeUntil:0

};

const npcDialogues = [

"thật trùng hợp, người cũng tới đây dạo chơi sao ?",

"hì hì hì, người có muốn xem ảo thuật không ?",

"kì tích thật xinh đẹp",

"cứ coi như...ta là một kì tích đi",

"hì hì hì"

];

function showDialogue(text){

const box =
document.getElementById("dialogue");

box.innerHTML =
"Âm dương sư : " + text;

box.style.display = "block";

clearTimeout(box.hideTimer);

box.hideTimer = setTimeout(()=>{

box.style.display = "none";

},3000);

}

document.getElementById("enter").onclick = ()=>{

const name =
document.getElementById("name").value.trim();

socket.emit("login", name);

};

socket.on("loginFailed",(msg)=>{

document.getElementById("error").innerText = msg;

});

socket.on("loginSuccess",(player)=>{

myId = player.id;

document.getElementById("login").style.background =
"black";

document.getElementById("login").innerHTML = "";

setTimeout(()=>{

document.getElementById("login").style.display =
"none";

document.getElementById("message").style.display =
"flex";

setTimeout(()=>{

document.getElementById("message").style.display =
"none";

canvas.style.display = "block";

loop();

},2500);

},1000);

});

socket.on("players",(p)=>{

players = p;

});

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowUp")
socket.emit("move","up");

if(e.key==="ArrowDown")
socket.emit("move","down");

if(e.key==="ArrowLeft")
socket.emit("move","left");

if(e.key==="ArrowRight")
socket.emit("move","right");

});

canvas.addEventListener("click",(e)=>{

const mx = e.clientX;
const my = e.clientY;

const nx = npc.x - camera.x;
const ny = npc.y - camera.y;

if(

mx >= nx &&
mx <= nx + 40 &&
my >= ny &&
my <= ny + 40

){

npc.freezeUntil = Date.now() + 3000;

const randomDialogue =

npcDialogues[
Math.floor(
Math.random()*npcDialogues.length
)
];

showDialogue(randomDialogue);

}

});
function drawTorii(x,y){

ctx.fillStyle = "black";
ctx.strokeStyle = "white";
ctx.lineWidth = 4;

function block(px,py,w,h){

ctx.fillRect(px,py,w,h);
ctx.strokeRect(px,py,w,h);

}

block(x,y,20,200);

block(x+180,y,20,200);

block(x-40,y,280,20);

block(x-20,y+40,240,15);

}

function drawMap(){

ctx.fillStyle = "black";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "white";

ctx.fillRect(
0-camera.x,
0-camera.y,
mapSize,
mapSize
);

const roadX = 1970;
const roadY = 0;

ctx.fillStyle = "black";

ctx.fillRect(
roadX-camera.x,
roadY-camera.y,
60,
4000
);

ctx.strokeStyle = "white";

ctx.lineWidth = 4;

ctx.strokeRect(
roadX-camera.x,
roadY-camera.y,
60,
4000
);

drawTorii(
1900-camera.x,
3760-camera.y
);

}

function drawPlayers(){

Object.values(players).forEach(p=>{

const x = p.x-camera.x;
const y = p.y-camera.y;

ctx.fillStyle = "white";

ctx.fillRect(x,y,40,40);

ctx.strokeStyle = "black";

ctx.strokeRect(x,y,40,40);

ctx.font = "18px serif";

ctx.lineWidth = 4;

ctx.strokeStyle = "black";

ctx.strokeText(p.name,x-20,y-10);

ctx.fillStyle = "white";

ctx.fillText(p.name,x-20,y-10);

});

const nx = npc.x-camera.x;
const ny = npc.y-camera.y;

ctx.fillStyle = "white";

ctx.fillRect(nx,ny,40,40);

ctx.strokeStyle = "black";

ctx.strokeRect(nx,ny,40,40);

ctx.font = "18px serif";

ctx.lineWidth = 4;

ctx.strokeStyle = "black";

ctx.strokeText("Âm dương sư",nx-30,ny-10);

ctx.fillStyle = "#5a0000";

ctx.fillText("Âm dương sư",nx-30,ny-10);

}

function drawFrontLayer(){

ctx.fillStyle = "black";
ctx.strokeStyle = "white";
ctx.lineWidth = 4;

function block(px,py,w,h){

ctx.fillRect(px,py,w,h);
ctx.strokeRect(px,py,w,h);

}

block(
1900-camera.x,
3760-camera.y,
20,
200
);

block(
2080-camera.x,
3760-camera.y,
20,
200
);

block(
1860-camera.x,
3760-camera.y,
280,
20
);

block(
1880-camera.x,
3825-camera.y,
240,
15
);

}

function teleportNPC(){

npc.x = Math.random()*3900;
npc.y = Math.random()*3900;

npc.targetX = Math.random()*3900;
npc.targetY = Math.random()*3900;

npc.state = "wander";

npc.waitTimer = 0;
npc.teleportTimer = Date.now();

}
  
function loop(){

requestAnimationFrame(loop);

const me = players[myId];

if(me){

camera.x = me.x-innerWidth/2;
camera.y = me.y-innerHeight/2;

/* vùng đen vô tận */

if(
me.x < 0 ||
me.y < 0 ||
me.x > mapSize ||
me.y > mapSize
){

if(!me.voidTimer){

me.voidTimer = Date.now();

}

if(Date.now() - me.voidTimer > 60000){

me.x = spawnPoint.x;
me.y = spawnPoint.y;

me.voidTimer = null;

}

}else{

me.voidTimer = null;

}

}

/* NPC lang thang */

const dxTarget = npc.targetX - npc.x;
const dyTarget = npc.targetY - npc.y;

const distTarget = Math.sqrt(
dxTarget*dxTarget +
dyTarget*dyTarget
);
  
/* tới điểm đích -> chọn điểm mới */

if(distTarget < 10){

npc.targetX = Math.random()*3900;
npc.targetY = Math.random()*3900;

}

/* di chuyển tự nhiên */

const angleTarget = Math.atan2(
dyTarget,
dxTarget
);

if(Date.now() > npc.freezeUntil){

npc.x += Math.cos(angleTarget)*npc.speed;
npc.y += Math.sin(angleTarget)*npc.speed;

}

/* lâu lâu teleport */

if(Date.now() - npc.teleportTimer > 20000){

teleportNPC();
}

/* chỉ phản ứng nếu tình cờ ở gần */

Object.values(players).forEach(p=>{

const dx = p.x - npc.x;
const dy = p.y - npc.y;

const dist = Math.sqrt(dx*dx + dy*dy);

/* quá sát -> biến mất */

if(dist < 20){

teleportNPC();

}

/* chỉ lại gần khi vô tình ở gần */

if(dist < 180){

const angle = Math.atan2(dy,dx);

const keepDistance = 60;

if(dist > keepDistance){

npc.x += Math.cos(angle)*0.8;
npc.y += Math.sin(angle)*0.8;

}

}

});

drawMap();

drawPlayers();

drawFrontLayer();

}

</script>

</body>
</html>
